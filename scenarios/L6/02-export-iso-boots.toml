id = "L6-02"
what = "a system exported to an ISO boots, and xlings answers in it"
covers = ["LCI-L6-IMAGE"]
needs = ["kvm", "network"]

[[step]]
in = "host"
run = "luban new img --edition tiny -y && luban export img {work}/img.iso"
timeout = 1800

[[step]]
in = "host"
# The console asks "Please press Enter to activate this console" first: an
# Enter, then what is typed (2026.10.24.1 took `xlings --version` as that Enter).
run = "{ sleep 90; printf '\\nxlings --version\\npoweroff\\n'; sleep 30; } | timeout 400 script -qfec 'luban enter {work}/img.iso' /dev/null"
has = ["luban-init: booting"]
matches = ["xlings \\d{4}\\."]
timeout = 480
