id = "L5-02"
what = "an idle desktop draws little: frames only for what changes"
covers = ["LCI-L5-IDLE"]
needs = ["kvm", "luban-os"]
systems = ["desktop-machine"]

[[step]]
in = "luban-os"
run = "idle desktop"
script = """
wait desktop 600
sleep 5000
perf reset
sleep 10000
state {work}/L5-02-state.json
"""
timeout = 900
read = "{work}/L5-02-state.json"
# What was shown: under a script the window turns on the script's own beat
# (30 ms), so perf.frames is that beat (335 in 10 s), not the desktop's frames.
limits = { "perf.presented" = 120 }
