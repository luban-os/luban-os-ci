id = "L5-01"
what = "a machine lists and reads its files: virtio-fs within its budget (9p measured beside it)"
covers = ["LCI-L5-FILES"]
needs = ["kvm"]
systems = ["core-machine"]

[[step]]
what = "on virtio-fs (the default)"
run = "grep ' / ' /proc/mounts; s=$(date +%s%N); find /usr -type f | wc -l; echo find_ms=$(( ($(date +%s%N) - s) / 1000000 ))"
has = ["virtiofs"]
measure = "find-usr-virtiofs"
measure_from = "find_ms=(\\d+)"

[[step]]
in = "host"
run = "luban config {system} --files 9p && luban stop {system}"
timeout = 120

[[step]]
what = "on 9p"
run = "grep ' / ' /proc/mounts; s=$(date +%s%N); find /usr -type f | wc -l; echo find_ms=$(( ($(date +%s%N) - s) / 1000000 ))"
has = ["9p"]
measure = "find-usr-9p"
measure_from = "find_ms=(\\d+)"
timeout = 900

[[step]]
in = "host"
run = "luban config {system} --files virtiofs && luban stop {system}"
timeout = 120

[budget]
find-usr-virtiofs = 1.5
