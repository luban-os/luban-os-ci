id = "L2-02"
what = "a user installs a package no edition has for themself, uses it, removes it"
covers = ["LCI-L2-USER-INSTALL"]
needs = ["kvm"]
systems = ["core-machine", "desktop-machine"]

[[step]]
run = "xlings install -y xim:zoxide || { xlings -v install -y xim:zoxide 2>&1 | grep -iE 'store|borrow|registers|snapshot|system' | tail -20; cat /etc/xlings/usr; ls /xlings/subos; grep -l zoxide /xlings/subos/*/.xlings.json; false; }"
lacks = ["[warn]"]
timeout = 900

[[step]]
in = "host"
what = "where the system's store registers it (shown on a failure above)"
run = "grep -l '\"zoxide\"' {home}/subos/*/.xlings.json {home}/domains/xlings/private/subos/*/.xlings.json 2>/dev/null; true"

[[step]]
what = "it runs"
run = "zoxide --version"
matches = ["^zoxide \\d"]

[[step]]
run = "xlings remove -y zoxide"
lacks = ["is the system's", "nothing to remove"]

[[step]]
what = "it is gone"
run = "command -v zoxide"
exit = "nonzero"
known = "xlings design 2026-10-21 J33: a user view's install goes active for everyone"
